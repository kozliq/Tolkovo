</defs><rect width="1280" height="420" rx="28" fill="#111116"/><rect width="1280" height="420" rx="28" fill="url(#g1)"/><rect width="1280" height="420" rx="28" fill="url(#g2)"/><rect width="1280" height="420" rx="28" fill="url(#g3)"/><rect x="60" y="90" width="540" height="60" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.09)"/><text x="88" y="128" font-size="21" fill="rgba(255,255,255,.42)" text-decoration="line-through">гитхаб</text><path d="M300 120 h40 M330 111 l10 9 -10 9" stroke="rgba(255,255,255,.45)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="370" y="128" font-size="21" font-weight="700" fill="#fff">GitHub</text><rect x="60" y="166" width="540" height="60" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.09)"/><text x="88" y="204" font-size="21" fill="rgba(255,255,255,.42)" text-decoration="line-through">телега</text><path d="M300 196 h40 M330 187 l10 9 -10 9" stroke="rgba(255,255,255,.45)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="370" y="204" font-size="21" font-weight="700" fill="#fff">Telegram</text><rect x="60" y="242" width="540" height="60" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.09)"/><text x="88" y="280" font-size="21" fill="rgba(255,255,255,.42)" text-decoration="line-through">пул реквест</text><path d="M300 272 h40 M330 263 l10 9 -10 9" stroke="rgba(255,255,255,.45)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="370" y="280" font-size="21" font-weight="700" fill="#fff">pull request</text><rect x="60" y="318" width="540" height="60" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.09)"/><text x="88" y="356" font-size="21" fill="rgba(255,255,255,.42)" text-decoration="line-through">чат джипити</text><path d="M300 348 h40 M330 339 l10 9 -10 9" stroke="rgba(255,255,255,.45)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="370" y="356" font-size="21" font-weight="700" fill="#fff">ChatGPT</text><text x="680" y="140" font-size="38" font-weight="800" fill="#fff">Понимает, как мы</text><text x="680" y="186" font-size="38" font-weight="800" fill="url(#cherry)">на самом деле говорим.</text><text x="680" y="240" font-size="18" fill="rgba(255,255,255,.64)">Внутри — GigaAM, модель, обученная</text><text x="680" y="266" font-size="18" fill="rgba(255,255,255,.64)">на русской речи. А словарь чинит то,</text><text x="680" y="292" font-size="18" fill="rgba(255,255,255,.64)">на чём спотыкаются все: английские</text><text x="680" y="318" font-size="18" fill="rgba(255,255,255,.64)">слова посреди русской фразы.</text><text x="680" y="360" font-size="18" fill="rgba(255,255,255,.64)">Свои замены — в настройках.</text></svg>