<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs>
<radialGradient id="g1" cx="18%" cy="20%" r="55%"><stop offset="0" stop-color="#3a2c5c"/><stop offset="1" stop-color="#3a2c5c" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="88%" cy="85%" r="50%"><stop offset="0" stop-color="#5c2231"/><stop offset="1" stop-color="#5c2231" stop-opacity="0"/></radialGradient>
<radialGradient id="g3" cx="75%" cy="8%" r="45%"><stop offset="0" stop-color="#1d3c5e"/><stop offset="1" stop-color="#1d3c5e" stop-opacity="0"/></radialGradient>
<linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A3263C"/><stop offset="1" stop-color="#5B1426"/></linearGradient>
<linearGradient id="cherry" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a9c"/><stop offset=".5" stop-color="#e0566e"/><stop offset="1" stop-color="#a3263c"/></linearGradient>
<linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0f18"/><stop offset=".6" stop-color="#16161b"/></linearGradient></defs><rect width="1280" height="460" rx="28" fill="#111116"/><rect width="1280" height="460" rx="28" fill="url(#g1)"/><rect width="1280" height="460" rx="28" fill="url(#g2)"/><rect width="1280" height="460" rx="28" fill="url(#g3)"/><text x="80" y="120" font-size="40" font-weight="800" fill="#fff">Итоги месяца.</text><text x="80" y="170" font-size="40" font-weight="800" fill="rgba(255,255,255,.5)">Скоро.</text><text x="80" y="224" font-size="18" fill="rgba(255,255,255,.64)">Сколько слов наговорил, сколько часов сэкономил</text><text x="80" y="250" font-size="18" fill="rgba(255,255,255,.64)">и сколько раз сказал «короче». Считается только</text><text x="80" y="276" font-size="18" fill="rgba(255,255,255,.64)">у тебя — делиться или нет, решаешь ты.</text><rect x="740" y="50" width="440" height="360" rx="30" fill="url(#wbg)" stroke="rgba(224,86,110,.3)"/><rect x="1090" y="72" width="70" height="26" rx="13" fill="rgba(255,255,255,.08)"/><text x="1125" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="rgba(255,255,255,.64)">пример</text><text x="772" y="100" font-size="15" font-weight="600" fill="rgba(255,255,255,.64)">Твой сентябрь в Tolkovo</text><text x="772" y="170" font-size="56" font-weight="900" letter-spacing="-2" fill="#fff">48 213</text><text x="990" y="170" font-size="22" fill="rgba(255,255,255,.64)">слов</text><rect x="772" y="210" width="376" height="1" fill="rgba(255,255,255,.09)"/><text x="772" y="248" font-size="17" fill="rgba(255,255,255,.64)">Сэкономлено</text><text x="1148" y="248" text-anchor="end" font-size="17" font-weight="700" fill="#fff">11 ч 40 мин</text><rect x="772" y="270" width="376" height="1" fill="rgba(255,255,255,.09)"/><text x="772" y="308" font-size="17" fill="rgba(255,255,255,.64)">Промтов нейросетям</text><text x="1148" y="308" text-anchor="end" font-size="17" font-weight="700" fill="#fff">326</text><rect x="772" y="330" width="376" height="1" fill="rgba(255,255,255,.09)"/><text x="772" y="368" font-size="17" fill="rgba(255,255,255,.64)">Сказал «короче»</text><text x="1148" y="368" text-anchor="end" font-size="17" font-weight="700" fill="#e0566e">314 раз</text></svg>