<linearGradient id="liqh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B1426"/><stop offset="1" stop-color="#e0566e"/></linearGradient></defs><style>@keyframes a1{0%{transform:scaleX(0)}45%{transform:scaleX(1)}85%{transform:scaleX(1)}100%{transform:scaleX(0)}}.b1,.b2{transform-origin:0 0;animation:a1 6s ease-in-out infinite}</style><rect width="1280" height="420" rx="28" fill="#111116"/><rect width="1280" height="420" rx="28" fill="url(#g1)"/><rect width="1280" height="420" rx="28" fill="url(#g2)"/><rect width="1280" height="420" rx="28" fill="url(#g3)"/><text x="80" y="110" font-size="40" font-weight="800" fill="#fff">Промт на пять минут —</text><text x="80" y="160" font-size="40" font-weight="800" fill="url(#cherry)">за полминуты.</text><text x="80" y="206" font-size="19" fill="rgba(255,255,255,.64)">Человек печатает около 40 слов в минуту, а говорит — около 130.</text><text x="80" y="268" font-size="17" font-weight="700" fill="#fff">Печатаю</text><text x="1200" y="268" text-anchor="end" font-size="17" fill="rgba(255,255,255,.64)">~40 слов/мин</text><rect x="80" y="282" width="1120" height="16" rx="8" fill="rgba(255,255,255,.07)"/><rect class="b1" x="80" y="282" width="345" height="16" rx="8" fill="rgba(255,255,255,.4)"/><text x="80" y="344" font-size="17" font-weight="700" fill="#fff">Говорю в Tolkovo</text><text x="1200" y="344" text-anchor="end" font-size="17" fill="rgba(255,255,255,.64)">~130 слов/мин</text><rect x="80" y="358" width="1120" height="16" rx="8" fill="rgba(255,255,255,.07)"/><rect class="b2" x="80" y="358" width="1120" height="16" rx="8" fill="url(#liqh)"/></svg>