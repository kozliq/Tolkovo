<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tolkovo app icon source. Render to PNG (1024) with a transparent
       background (QuickLook/qlmanage paints SVG over white — cut the body
       out onto transparency afterwards), then run `bun tauri icon`.
       The pill on Liquid Glass filled with burgundy glass from the bottom —
       the same look as the on-screen pill while recording. -->
  <defs>
    <!-- macOS icon grid: 824×824 body inside a 1024 canvas. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2c33"/>
      <stop offset="1" stop-color="#0f0f13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#8e2138" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8e2138" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fillBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c83e58"/>
      <stop offset="0.45" stop-color="#8e2138"/>
      <stop offset="1" stop-color="#5b1426"/>
    </linearGradient>
    <linearGradient id="fillSides" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14000a" stop-opacity="0.35"/>
      <stop offset="0.3" stop-color="#14000a" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#14000a" stop-opacity="0"/>
      <stop offset="1" stop-color="#14000a" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="fillSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3c3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb3c3" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="capsuleClip">
      <rect x="362" y="200" width="300" height="624" rx="150"/>
    </clipPath>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bodyEdge)"/>

  <!-- Capsule shadow -->
  <rect x="372" y="236" width="280" height="610" rx="140" fill="#000" opacity="0.55" filter="url(#softShadow)"/>

  <!-- Glass capsule -->
  <rect x="362" y="200" width="300" height="624" rx="150" fill="url(#glassFill)"/>

  <!-- Burgundy glass filling the capsule from the bottom -->
  <g clip-path="url(#capsuleClip)">
    <rect x="362" y="430" width="300" height="394" fill="url(#fillBody)"/>
    <rect x="362" y="430" width="300" height="394" fill="url(#fillSides)"/>
    <rect x="362" y="430" width="300" height="5" fill="#ffd2dc" opacity="0.75"/>
    <rect x="362" y="435" width="300" height="70" fill="url(#fillSheen)"/>
  </g>

  <!-- Glass rim and highlight on top -->
  <rect x="364" y="202" width="296" height="620" rx="148" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <path d="M 410 300 Q 412 248 470 232" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>

  <!-- Microphone at the bottom of the capsule -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" transform="translate(512 742) scale(4.2) translate(-12 -12)">
    <rect x="9" y="3" width="6" height="11" rx="3" stroke-width="2"/>
    <path d="M5 11a7 7 0 0 0 14 0" stroke-width="2"/>
    <path d="M12 18v3" stroke-width="2"/>
  </g>
</svg>
